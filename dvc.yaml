# Versioned pipeline: dvc repro runs only the stages whose inputs changed,
# and dvc.lock records the exact hash of every input and output.
# Run with: uv run dvc repro
stages:
  generate:
    cmd: python -m fraudshield.data.generate --config configs/pipeline.yaml --out data/raw/logs.csv
    deps:
      - src/fraudshield/data
    params:
      - configs/pipeline.yaml:
          - generator
    outs:
      - data/raw/logs.csv

  ingest:
    cmd: python -m fraudshield.pipeline.ingest --config configs/pipeline.yaml
    deps:
      - data/raw/logs.csv
      - src/fraudshield/ingestion
      - src/fraudshield/pipeline/ingest.py
      - src/fraudshield/pipeline/config.py
      - src/fraudshield/validation
    params:
      - configs/pipeline.yaml:
          - validation
    outs:
      - data/interim/clean.csv

  label:
    cmd: python -m fraudshield.pipeline.label --config configs/pipeline.yaml
    deps:
      - data/interim/clean.csv
      - src/fraudshield/labelling
      - src/fraudshield/pipeline/label.py
      - src/fraudshield/pipeline/config.py
      - src/fraudshield/validation
    params:
      - configs/pipeline.yaml:
          - validation
    outs:
      - data/interim/labelled.csv

  features:
    cmd: python -m fraudshield.pipeline.features --config configs/pipeline.yaml
    deps:
      - data/interim/labelled.csv
      - src/fraudshield/features
      - src/fraudshield/pipeline/features.py
      - src/fraudshield/pipeline/config.py
      - src/fraudshield/validation
    params:
      - configs/pipeline.yaml:
          - validation
    outs:
      - data/processed/features.csv
      - data/processed/encoders.json
      - data/processed/feature_state.joblib

  train:
    cmd: python -m fraudshield.pipeline.train --config configs/pipeline.yaml
    deps:
      - data/processed/features.csv
      - data/processed/encoders.json
      - data/processed/feature_state.joblib
      - src/fraudshield/training
      - src/fraudshield/evaluation/metrics.py
      - src/fraudshield/evaluation/threshold_tuner.py
      - src/fraudshield/pipeline/train.py
      - src/fraudshield/pipeline/config.py
    params:
      - configs/pipeline.yaml:
          - training
    outs:
      - models
    metrics:
      - reports/metrics.json:
          cache: false

  gate:
    cmd: python -m fraudshield.pipeline.gate --config configs/pipeline.yaml
    deps:
      - models
      - reports/metrics.json
      - configs/golden_cases.yaml
      - configs/behaviour_cases.yaml
      - src/fraudshield/evaluation/gates.py
      - src/fraudshield/pipeline/gate.py
      - src/fraudshield/serving
    params:
      - configs/pipeline.yaml:
          - gates
    metrics:
      - reports/gate.json:
          cache: false

  seeds:
    cmd: python -m fraudshield.pipeline.seeds --config configs/pipeline.yaml
    deps:
      - models
      - src/fraudshield/data
      - src/fraudshield/ingestion
      - src/fraudshield/labelling
      - src/fraudshield/features
      - src/fraudshield/evaluation/metrics.py
      - src/fraudshield/evaluation/threshold_tuner.py
      - src/fraudshield/pipeline/seeds.py
    params:
      - configs/pipeline.yaml:
          - generator
          - training
          - seeds
    metrics:
      - reports/seeds.json:
          cache: false

  register:
    cmd: python -m fraudshield.registry.register --config configs/pipeline.yaml
    deps:
      - models
      - reports/gate.json
      - reports/seeds.json
      - src/fraudshield/registry/register.py
      - src/fraudshield/registry/pyfunc_model.py
    params:
      - configs/pipeline.yaml:
          - registry
    outs:
      - reports/registry.json:
          cache: false

  reference:
    cmd: python -m fraudshield.pipeline.reference --config configs/pipeline.yaml
    deps:
      - models
      - src/fraudshield/monitoring
      - src/fraudshield/pipeline/reference.py
      - src/fraudshield/data
      - src/fraudshield/ingestion
      - src/fraudshield/labelling
      - src/fraudshield/features
      - src/fraudshield/serving
    params:
      - configs/pipeline.yaml:
          - generator
          - monitoring.reference
    outs:
      - reports/reference.json:
          cache: false

  drift_drill:
    cmd: python -m fraudshield.pipeline.drift_drill --config configs/pipeline.yaml
    deps:
      - models
      - reports/reference.json
      - src/fraudshield/monitoring
      - src/fraudshield/pipeline/drift_drill.py
      - src/fraudshield/data
      - src/fraudshield/ingestion
      - src/fraudshield/labelling
      - src/fraudshield/features
      - src/fraudshield/serving
    params:
      - configs/pipeline.yaml:
          - generator
          - monitoring
    metrics:
      - reports/drift_drill.json:
          cache: false
