[project]
name = "fraudshield"
version = "0.1.0"
description = "Production MLOps system for transaction fraud detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.143.0",
    "imbalanced-learn>=0.14.2",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "shap>=0.52.0",
    "uvicorn>=0.54.0",
]
train = [
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "scipy>=1.18.1",
    "shap>=0.52.0",
    "xgboost-cpu>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint.per-file-ignores]
# Log timestamps are naive local times by design; tests mirror that.
"tests/*" = ["DTZ"]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
