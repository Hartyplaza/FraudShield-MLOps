# Continuous integration: runs on every push to main and every pull request.
#
#   lint-test   ruff + the full test suite
#   reproduce   rebuilds the whole pipeline from config on a clean machine and
#               checks the results match the ones committed in reports/
#   docker      builds both images, trains inside the container (up to the
#               quality gate), starts the API and scores two transactions
#   image       builds the deployable API image (model trained and gated during
#               the build), smoke-tests it, and on main publishes it to
#               GitHub Container Registry as :latest and :sha-<commit>
#
# The data is synthetic and generated from configs/pipeline.yaml, so CI needs no
# data store and no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  MLFLOW_DISABLE_AGENT_HINT: "1"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (from the lockfile)
        run: uv sync --all-extras --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q

  reproduce:
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (from the lockfile)
        run: uv sync --all-extras --frozen
      - name: Rebuild the pipeline from scratch (generate -> gate -> seeds -> drift drill)
        run: uv run dvc repro gate seeds drift_drill
      - name: Results must match the committed ones exactly
        run: |
          git diff --exit-code reports/metrics.json reports/gate.json reports/seeds.json \
            reports/reference.json reports/drift_drill.json
          echo "Reproduced: metrics, quality gate, seed results and drift drill are identical to the commit."
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  docker:
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Train in the container, then start the API
        run: |
          docker compose up -d
          for i in $(seq 1 90); do
            if curl -fs localhost:8000/health; then echo; exit 0; fi
            train=$(docker compose ps -a train --format '{{.State}} {{.ExitCode}}')
            case "$train" in
              "exited 0"|running*|"") ;;
              exited*) echo "Training container failed: $train"; exit 1 ;;
            esac
            sleep 10
          done
          echo "API did not become healthy in 15 minutes"; exit 1
      - name: "Smoke test: one clear fraud, one clear legit transaction"
        run: |
          fraud='{"log": "2025-08-02 02:30:00 | user: user7001 | txn: cashout of $4800.00 from London | device: iPhone 13"}'
          legit='{"log": "2025-08-02 13:00:00 | user: user7002 | txn: purchase of $45.20 from Glasgow | device: iPhone 13"}'
          curl -fs -X POST localhost:8000/score -H 'Content-Type: application/json' -d "$fraud" | tee /dev/stderr | grep -q '"is_fraud":true'
          curl -fs -X POST localhost:8000/score -H 'Content-Type: application/json' -d "$legit" | tee /dev/stderr | grep -q '"is_fraud":false'
          curl -fs localhost:8000/monitoring/drift | tee /dev/stderr | jq -e '.status == "insufficient_data"' > /dev/null
          echo "Smoke test passed"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color | tail -100
      - name: Clean up
        if: always()
        run: docker compose down -v

  image:
    needs: [reproduce, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name and tags
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/${repo}" >> "$GITHUB_ENV"
          echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build (trains the model and runs the quality gate inside the build)
        run: |
          docker build --target app \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --build-arg "REVISION=${GITHUB_SHA::7}" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
      - name: "Smoke test: run the image as a cloud host would ($PORT set)"
        run: |
          docker run -d --name api -p 8080:8080 -e PORT=8080 "$IMAGE:$TAG"
          for i in $(seq 1 30); do
            if curl -fs localhost:8080/health; then echo; break; fi
            sleep 2
          done
          curl -fs localhost:8080/health | jq -e --arg r "${GITHUB_SHA::7}" '.revision == $r'
          fraud='{"log": "2025-08-02 02:30:00 | user: user7001 | txn: cashout of $4800.00 from London | device: iPhone 13"}'
          legit='{"log": "2025-08-02 13:00:00 | user: user7002 | txn: purchase of $45.20 from Glasgow | device: iPhone 13"}'
          curl -fs -X POST localhost:8080/score -H 'Content-Type: application/json' -d "$fraud" | tee /dev/stderr | grep -q '"is_fraud":true'
          curl -fs -X POST localhost:8080/score -H 'Content-Type: application/json' -d "$legit" | tee /dev/stderr | grep -q '"is_fraud":false'
          curl -fs localhost:8080/monitoring/drift | tee /dev/stderr | jq -e '.status == "insufficient_data"' > /dev/null
          echo "Image smoke test passed"
      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -50 || true
      - name: Publish to GitHub Container Registry (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$TAG and $IMAGE:latest"

  deploy:
    # Redeploys the Render service with the image just published, waits until
    # /health reports this commit, then runs the smoke test against the live URL.
    # Skipped (with a notice) until the RENDER_DEPLOY_HOOK secret is set.
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      SERVICE_URL: ${{ vars.SERVICE_URL || 'https://fraudshield-ef2l.onrender.com' }}
    steps:
      - name: Trigger the Render deploy
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK secret not set; deploy skipped"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" -o /dev/null
          echo "Deploy requested for revision ${GITHUB_SHA::7}"
      - name: Wait until this commit is live
        if: env.SKIP != '1'
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            got=$(curl -fs --max-time 60 "$SERVICE_URL/health" | jq -r '.revision // empty' || true)
            if [ "$got" = "$want" ]; then echo "Live revision: $got"; exit 0; fi
            echo "Waiting (live: ${got:-none}, expected: $want)"
            sleep 10
          done
          echo "Revision $want not live after 10 minutes"; exit 1
      - name: "Smoke test: the live service"
        if: env.SKIP != '1'
        run: |
          fraud='{"log": "2025-08-02 02:30:00 | user: user7001 | txn: cashout of $4800.00 from London | device: iPhone 13"}'
          legit='{"log": "2025-08-02 13:00:00 | user: user7002 | txn: purchase of $45.20 from Glasgow | device: iPhone 13"}'
          curl -fs -X POST "$SERVICE_URL/score" -H 'Content-Type: application/json' -d "$fraud" | tee /dev/stderr | grep -q '"is_fraud":true'
          curl -fs -X POST "$SERVICE_URL/score" -H 'Content-Type: application/json' -d "$legit" | tee /dev/stderr | grep -q '"is_fraud":false'
          curl -fs "$SERVICE_URL/monitoring/drift" | tee /dev/stderr | jq -e '.window == 1000' > /dev/null
          echo "Live smoke test passed: $SERVICE_URL"
