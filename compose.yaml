# docker compose up
#   1. train: runs the DVC pipeline up to the quality gate; a model is written to
#             the 'models' volume only if the gate passes
#   2. api:   starts only after train succeeds, and serves that model read-only
services:
  train:
    build:
      context: .
      target: train
    image: fraudshield-train:latest
    volumes:
      - models:/out/models
      - reports:/out/reports

  api:
    build:
      context: .
      target: serve
    image: fraudshield-serve:latest
    depends_on:
      train:
        condition: service_completed_successfully
    environment:
      MODEL_DIR: /app/models
    volumes:
      - models:/app/models:ro
      - reports:/app/reports:ro
    ports:
      - "8000:8000"

volumes:
  models:
  reports: